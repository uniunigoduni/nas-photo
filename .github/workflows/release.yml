name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test
        run: |
          go test ./...
          go vet ./...

      - name: Build two release executables
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/nas-photo-windows-amd64.exe ./cmd/nas-photo
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/nas-photo-linux-arm64 ./cmd/nas-photo
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/nas-photo-windows-amd64.exe \
              dist/nas-photo-linux-arm64 \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/nas-photo-windows-amd64.exe \
              dist/nas-photo-linux-arm64 \
              --verify-tag \
              --generate-notes \
              --title "NAS-PHOTO $GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY"
          fi
